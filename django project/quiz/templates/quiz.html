<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Python Quiz</title>
    <link rel="stylesheet" href="/static/styles.css?v=20261112">
</head>
<body>
<header class="site-header">
    <a class="brand" href="{% url 'quiz_start' %}"><span class="brand-mark">Q</span> Python Quiz</a>
    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button class="logout-button" type="submit">Log out</button>
    </form>
</header>
<main class="quiz-card">
    <div class="quiz-header">
        <div class="quiz-heading">
            <p class="eyebrow">PYTHON KNOWLEDGE CHECK</p>
            <h1>Python Quiz</h1>
            <p>Choose one answer for each question, then submit to see your score.</p>
        </div>
        <p class="quiz-timer" role="timer" aria-live="polite">
            Time remaining: <span id="quiz-timer" data-remaining-seconds="{{ remaining_seconds }}">05:00</span>
        </p>
    </div>
    <form id="quiz-form" method="post">
        {% csrf_token %}
        {% for question in questions %}
            <fieldset>
                <legend>{{ question.question }}</legend>
                <div class="options-grid">
                    {% for option in question.options %}
                        <label class="answer-option">
                            <input type="radio" name="q{{ forloop.parentloop.counter0 }}" value="{{ option }}" required>
                            <span>{{ option }}</span>
                        </label>
                    {% endfor %}
                </div>
            </fieldset>
        {% endfor %}
        <button class="submit-button" type="submit">Submit answers</button>
    </form>
</main>
<script>
    const timer = document.getElementById("quiz-timer");
    const quizForm = document.getElementById("quiz-form");
    let remainingSeconds = Number(timer.dataset.remainingSeconds);

    function updateTimer() {
        const minutes = Math.floor(remainingSeconds / 60);
        const seconds = remainingSeconds % 60;
        timer.textContent = `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
        timer.classList.toggle("quiz-timer-urgent", remainingSeconds <= 60);

        if (remainingSeconds <= 0) {
            quizForm.submit();
            return;
        }

        remainingSeconds -= 1;
        window.setTimeout(updateTimer, 1000);
    }

    updateTimer();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz Result | Python Quiz</title>
    <link rel="stylesheet" href="/static/styles.css?v=20261112">
</head>
<body>
<header class="site-header">
    <a class="brand" href="{% url 'quiz_start' %}"><span class="brand-mark">Q</span> Python Quiz</a>
    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button class="logout-button" type="submit">Log out</button>
    </form>
</header>
<main class="result-card">
    <span class="result-icon">✓</span>
    <p class="eyebrow">QUIZ COMPLETE</p>
    <h1>Your result</h1>
    <div class="score">{{ score }} <span>/ {{ total }}</span></div>
    <p class="result-message">{{ message }}</p>
    <a class="submit-button" href="{% url 'quiz_start' %}">Try again</a>
</main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Login | Python Quiz</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<main class="auth-card">
    <a class="brand" href="{% url 'login' %}"><span class="brand-mark">Q</span> Python Quiz</a>
    <h1>Welcome back</h1>
    <p class="auth-intro">Sign in to take the quiz and see your result.</p>
    {% if form.errors %}<p class="error" role="alert">Your username or password was incorrect. Please try again.</p>{% endif %}
    <form method="post">
        {% csrf_token %}
        <label for="{{ form.username.id_for_label }}">Username</label>
        {{ form.username }}
        <label for="{{ form.password.id_for_label }}">Password</label>
        {{ form.password }}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <button type="submit">Log in</button>
    </form>
    <p class="auth-footer">New here? <a href="{% url 'register' %}">Create an account</a></p>
</main>
</body>
</html>

{% extends "base.html" %}
{% block title %}Delete student{% endblock %}
{% block content %}
<div class="panel-card confirm-card"><div class="confirm-icon">!</div><h1>Delete student?</h1><p>Are you sure you want to delete <strong>{{ object.full_name }}</strong> ({{ object.student_id }})? This action cannot be undone.</p><form method="post">{% csrf_token %}<a class="btn btn-light" href="{% url 'student-detail' object.pk %}">Cancel</a> <button class="btn btn-danger" type="submit">Delete student</button></form></div>
{% endblock %}
